services:
  - type: web
    name: argus-rec
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ARGUS_WHISPER_MODEL
        value: tiny
      - key: ARGUS_RECORDINGS_DIR
        value: /tmp/argus_recordings
      - key: ARGUS_COMPUTE_TYPE
        value: int8
      - key: ARGUS_CPU_THREADS
        value: "1"

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аргус</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="index">
  <div class="app">
    <header class="header">
      <h1 class="logo">Аргус</h1>
    </header>

    <main class="main">
      <div class="action-bar">
        <button class="btn btn-primary" id="btn-record">Записать</button>
        <label class="btn btn-secondary" id="btn-upload-label">
          Загрузить файл
          <input type="file" id="file-input" accept="audio/*" hidden>
        </label>
      </div>

      <div id="recording-panel" class="recording-panel" hidden>
        <div class="recording-indicator">
          <span class="recording-dot"></span>
          <span id="recording-timer">00:00</span>
        </div>
        <button class="btn btn-stop" id="btn-stop-record">Остановить</button>
      </div>

      <div id="upload-status" class="upload-status" hidden></div>

      <section class="section">
        <h2 class="section-title">Записи</h2>
        <div id="file-list"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
